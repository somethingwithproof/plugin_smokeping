name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarCloud analysis
    # No secret on forks or Dependabot: only same-repository pull requests,
    # pushes to main, and a manual run on main get the token.
    if: >-
      github.repository == 'somethingwithproof/plugin_smokeping' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout full history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify analysis credential
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::SONAR_TOKEN must be configured in repository Actions secrets.'
          exit 1
        fi

    - name: Install PHP 8.3 with pcov
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'
        tools: composer:2.10.3
        extensions: intl, mbstring, xml, gmp
        coverage: pcov

    # The same locked Pest harness as plugin-ci-workflow.yml.
    - name: Checkout shared CI tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Cacti/cacti
        ref: f3ff777992875740e4665fedfe2eff8335f5b894
        persist-credentials: false
        path: ci-tools
        sparse-checkout: |
          tests/tools/plugin-harness

    - name: Install the locked Pest harness
      run: |
        set -euo pipefail
        harness="$RUNNER_TEMP/cacti-plugin-harness"
        mkdir -p "$harness"
        cp ci-tools/tests/tools/plugin-harness/composer.json ci-tools/tests/tools/plugin-harness/composer.lock "$harness/"
        composer --working-dir="$harness" install --no-interaction --no-progress --prefer-dist
        echo "CACTI_PEST_BIN=$harness/vendor/bin/pest" >> "$GITHUB_ENV"

    # The harness now lives in RUNNER_TEMP. The checkout must go before the
    # tests, whose source rules scan the whole tree, and before the analysis.
    - name: Remove the CI tooling checkout
      run: rm -rf ci-tools

    - name: Unit tests with coverage
      run: '"$CACTI_PEST_BIN" --configuration=phpunit.xml --coverage-clover=build/coverage/clover.xml'

    # workflow_dispatch does not infer the branch, so the context is checked
    # before it reaches the scanner's arguments.
    - name: Select branch or pull request context
      id: context
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.event.pull_request.head.ref }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = pull_request ]; then
          # The names go into the scanner's arguments, so only characters
          # that need no quoting pass: Git's own branch names, including +.
          ref='^[A-Za-z0-9._/+-]+$'
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD" =~ $ref && "$PR_BASE" =~ $ref ]]; then
            echo '::error::The pull request number or a branch name has characters the analysis does not pass to the scanner.'
            exit 1
          fi
          args="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD -Dsonar.pullrequest.base=$PR_BASE"
        else
          case "$REF_NAME" in main) ;; *) exit 1 ;; esac
          args="-Dsonar.branch.name=$REF_NAME"
        fi
        echo "args=$args" >> "$GITHUB_OUTPUT"

    - name: Analyze and wait for the quality gate
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >-
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
          ${{ steps.context.outputs.args }}
