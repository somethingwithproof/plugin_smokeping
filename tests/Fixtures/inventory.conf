# Inventory fixture for the configuration parser. @DIR@ is replaced by
# tests/oracle/run.sh and tests/reader-e2e.sh with a scratch directory holding
# the files SmokePing's parser checks for.

*** General ***

owner    = Fixture Owner
contact  = fixture@example.net
mailhost = localhost
cgiurl   = http://localhost/smokeping.cgi
imgcache = @DIR@/cache
imgurl   = cache
datadir  = @DIR@/data
piddir   = @DIR@/run
smokemail = @DIR@/smokemail
tmail    = @DIR@/tmail

*** Database ***

step     = 300
pings    = 20

AVERAGE  0.5   1  1008

*** Presentation ***

template = @DIR@/basepage.html

+ overview
width = 600
height = 50
range = 10h

+ detail
width = 600
height = 200
"Last 3 Hours" 3h

*** Probes ***

+ FPing
binary = @DIR@/fping

++ FPingFast
step  = 60
pings = 10

++ FPingNormal

+ DNS
binary = @DIR@/dig

*** Slaves ***

secrets = @DIR@/secrets

+ boston
display_name = Boston
color = 0000ff

+ sydney.au
display_name = Sydney
color = 00ff00

*** Alerts ***

to = alertee@example.net
from = smokealert@example.net

+ someloss
type = loss
pattern = >0%,*12*,>0%,*12*,>0%
comment = loss 3 times in a row

+ bigloss
type = loss
pattern = ==0%,==0%,==0%,==0%,>50%,>50%,>50%
comment = suddenly there is packet loss

*** Targets ***

probe = FPingNormal
menu  = Top
title = Fixture
alerts = someloss

+ Europe
menu  = Europe
title = European sites

++ paris
menu  = Paris
title = Paris gateway
host  = 192.0.2.1
slaves = boston sydney.au

++ berlin
probe = FPingFast
host  = 192.0.2.2
alerts = bigloss

+++ core
menu = Core
host = 192.0.2.3

+ Slaves
nomasterpoll = yes
slaves = boston

++ remote
host = 192.0.2.4

+ DNS
probe = DNS
menu = DNS
alerts =

++ resolver
host = 192.0.2.53
lookup = example.net
pings = 5

+ Graphs
menu = Combined

++ multi
menu = Both gateways
host = /Europe/paris /Europe/berlin
