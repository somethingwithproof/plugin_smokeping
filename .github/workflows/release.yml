# Releases are made by pushing a tag, v<version>, for example v1.0.0 or
# v1.0.0-rc.1. The workflow refuses a tag that does not match INFO or has no
# dated CHANGELOG.md section, runs the whole CI for the tagged commit, builds
# the archive with tools/make-release.sh, attests its provenance, and publishes
# the GitHub Release with the notes from the changelog. See docs/RELEASING.md.
#
# Each job holds only the permissions it uses: contents: write is in `publish`,
# id-token: write and attestations: write are in `attest`.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

# A release is never cancelled half way: a second tag waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, INFO and CHANGELOG.md must agree before anything is built.
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check the tag against INFO and CHANGELOG.md
      id: check
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=$(sh tools/release-check.sh check "$TAG")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        case $version in
          *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
        esac

  # The same CI a pull request gets, on the tagged commit.
  ci:
    name: CI
    needs: check
    permissions:
      contents: read
    # zizmor prefers `$/.github/...` (GitHub's self-repository syntax, July 2026),
    # which actionlint 1.7.12 rejects. The workspace-relative form is documented
    # and works; switch when actionlint accepts the new form.
    uses: ./.github/workflows/plugin-ci-workflow.yml # zizmor: ignore[self-repository]

  build:
    name: Build the archive
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build smokeping-<version>.tar.gz and SHA256SUMS
      env:
        VERSION: ${{ needs.check.outputs.version }}
      run: |
        set -euo pipefail
        sh tools/make-release.sh "$GITHUB_SHA" dist
        test -f "dist/smokeping-$VERSION.tar.gz"
        test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 1
        (cd dist && sha256sum --check SHA256SUMS)

    - name: Upload the archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-dist
        path: |
          dist/smokeping-*.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 7

  attest:
    name: Attest the provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # request the OIDC token Sigstore signs the provenance with
      attestations: write # store the attestation for gh attestation verify
    steps:
    - name: Download the archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-dist
        path: dist

    - name: Attest the archive
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/SHA256SUMS
        create-storage-record: false

  publish:
    name: Publish the release
    needs: [check, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-dist
        path: dist

    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ needs.check.outputs.version }}
        PRERELEASE: ${{ needs.check.outputs.prerelease }}
      run: |
        set -euo pipefail
        sh tools/release-check.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
        flags=
        if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
        # --verify-tag refuses to create the tag: the release is of the tag that
        # was pushed and checked, never of a branch head.
        # shellcheck disable=SC2086
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $flags \
          "dist/smokeping-$VERSION.tar.gz" dist/SHA256SUMS
