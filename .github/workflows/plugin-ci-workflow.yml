# Follows the job layout of the maintained plugins (servcheck, webseer,
# monitor): Cacti checked out with this plugin under plugins/, a MariaDB
# service, Cacti installed from its CLI, the plugin installed with
# plugin_manage.php, and Pest from the locked shared plugin harness. The test
# harness choice is pending maintainers in #12; this matches what maintained
# plugins use today.

# The release workflow calls this one (workflow_call) for the tagged commit, so
# a release is built only from a commit that passed the same checks as a pull
# request. `ci-ok` is the one check branch protection needs to name.

name: CI

on:
  push:
    branches:
      - main
      - develop
  # Every pull request, whatever its base: the milestones land as a stack in
  # which each pull request targets the branch below it.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A called workflow sees the caller's github.workflow, so the group is spelled
# out. Only pull requests cancel: a push to main or a tag must run to the end.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cacti includes setup.php and the page scripts on whatever PHP a 1.2.31
  # site runs, so they must parse on PHP 8.0 even though the plugin refuses
  # to run below 8.2.
  entry-point-lint:
    name: PHP 8.0 entry point lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install PHP 8.0
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.0'
        coverage: none

    - name: Lint entry points
      run: |
        set -euo pipefail
        php -v
        for f in *.php include/*.php scripts/*.php cli/*.php; do
          php -l "$f"
        done

  integration-test:
    name: PHP ${{ matrix.php }} on Cacti ${{ matrix.cacti }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        cacti: ['release/1.2.31', '1.2.x']

    services:
      mariadb:
        image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Cacti
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: Cacti/cacti
        ref: ${{ matrix.cacti }}
        path: cacti

    - name: Checkout smokeping plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: cacti/plugins/smokeping

    - name: Install PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        tools: composer:2.10.3, phpstan:2.3.5
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring, snmp
        ini-values: "post_max_size=256M, max_execution_time=60, date.timezone=America/New_York"
        coverage: none

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Ubuntu 26.04's mysql client rejects the DELIMITER line at the top of
        # Cacti's cacti.sql; MariaDB's client loads it.
        sudo apt-get install -y rrdtool gettext mariadb-client

    # Core's release archives exclude tests/, so fetch the shared harness lock
    # at the same immutable revision the maintained plugins pin.
    - name: Checkout shared CI tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Cacti/cacti
        ref: f3ff777992875740e4665fedfe2eff8335f5b894
        persist-credentials: false
        path: ci-tools
        sparse-checkout: |
          tests/tools/plugin-harness

    # The shared setup-plugin-dependencies action also runs composer install
    # on the Cacti checkout, which needs a composer.lock that release/1.2.31
    # does not ship. Both Cacti refs commit include/vendor, so only the Pest
    # harness is installed here, from the same lock the action uses.
    - name: Install the locked Pest harness
      run: |
        set -euo pipefail
        harness="$RUNNER_TEMP/cacti-plugin-harness"
        mkdir -p "$harness"
        cp ci-tools/tests/tools/plugin-harness/composer.json ci-tools/tests/tools/plugin-harness/composer.lock "$harness/"
        composer --working-dir="$harness" validate --strict
        composer --working-dir="$harness" install --no-interaction --no-progress --prefer-dist
        echo "CACTI_PEST_BIN=$harness/vendor/bin/pest" >> "$GITHUB_ENV"

    - name: Initialize Cacti database
      run: |
        echo -e "[client]\nuser = root\npassword = cactiroot\nhost = 127.0.0.1\n" > ~/.my.cnf
        chmod 600 ~/.my.cnf
        mariadb -e "CREATE USER IF NOT EXISTS 'cactiuser'@'127.0.0.1' IDENTIFIED BY 'cactiuser';"
        mariadb -e "GRANT ALL PRIVILEGES ON cacti.* TO 'cactiuser'@'127.0.0.1';"
        mariadb -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'127.0.0.1';"
        mariadb -e "FLUSH PRIVILEGES;"
        mariadb cacti < cacti/cacti.sql
        mariadb -e "INSERT INTO settings (name, value) VALUES ('path_php_binary', '$(command -v php)')" cacti

    - name: Create Cacti config.php
      run: |
        sed -r "s/localhost/127.0.0.1/g" cacti/include/config.php.dist > cacti/include/config.php

    - name: Install Cacti via CLI
      working-directory: cacti
      run: php cli/install_cacti.php --accept-eula --install --force

    - name: Run unit tests
      working-directory: cacti/plugins/smokeping
      run: '"$CACTI_PEST_BIN" --configuration=phpunit.xml'

    # Installs, upgrades, and uninstalls the plugin through Cacti's own
    # plugin API, so it runs before the plugin is installed for the poller.
    - name: Run lifecycle and realm integration tests
      working-directory: cacti/plugins/smokeping
      env:
        CACTI_PATH: ${{ github.workspace }}/cacti
        SMOKEPING_TEST_DATABASE: disposable
      run: '"$CACTI_PEST_BIN" --configuration=phpunit-integration.xml'

    # The integration tests provoke refusals that the plugin logs as errors,
    # such as a schema downgrade. Keep their log apart so the error check
    # below covers the install and the poller run.
    - name: Set the integration tests' log aside
      if: always()
      run: |
        if [ -f cacti/log/cacti.log ]; then
          mv cacti/log/cacti.log cacti/log/integration.log
        fi

    - name: Install and enable the plugin
      working-directory: cacti
      run: php cli/plugin_manage.php --plugin=smokeping --install --enable

    # Against the minimum supported release only: the 1.2.x branch's
    # docblocks give PDO connections as resources and mistype some
    # parameters, which PHPStan reports at every call site.
    - name: Run PHPStan
      if: matrix.cacti == 'release/1.2.31'
      working-directory: cacti/plugins/smokeping
      env:
        CACTI_PATH: ${{ github.workspace }}/cacti
      run: phpstan analyse -c phpstan.neon --no-progress

    - name: Verify translation template
      working-directory: cacti/plugins/smokeping
      run: sh locales/build_gettext.sh --check

    - name: Run Cacti poller
      working-directory: cacti
      run: |
        php poller.php --poller=1 --force --debug
        grep -q "SYSTEM STATS" log/cacti.log

    - name: Check Cacti log for errors
      if: always()
      run: |
        if [ -f cacti/log/integration.log ]; then
          echo "== integration tests (not checked)"
          cat cacti/log/integration.log
        fi
        if [ -f cacti/log/cacti.log ]; then
          echo "== install and poller run"
          cat cacti/log/cacti.log
          if grep -E "FATAL:|ERROR:|WARNING:" cacti/log/cacti.log; then
            exit 1
          fi
        fi

  # The plugin's reader of SmokePing's configuration must agree with
  # SmokePing's own parser (2.7.3, 2.8.2 and 2.9.0) on generated, packaged
  # and fixture configurations.
  config-parser:
    name: SmokePing configuration parser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Compare with SmokePing's parser
      run: sh tests/oracle/run.sh "$RUNNER_TEMP/oracle"

    - name: Upload the comparison output
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: config-parser-logs
        path: ${{ runner.temp }}/oracle/out
        if-no-files-found: ignore

  # tests/lint-workflows.sh runs actionlint and zizmor from pinned images; the
  # same script lints the workflows on a developer machine. zizmor's online
  # audits (impostor commits, known-vulnerable actions) use the workflow token.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Lint the workflows with actionlint and zizmor
      env:
        GH_TOKEN: ${{ github.token }}
      run: sh tests/lint-workflows.sh

  # The release gate and the archive policy are plain shell over git; they need
  # neither Docker nor Cacti.
  release-tools:
    name: Release tools and archive policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Test tools/release-check.sh
      run: sh tests/release-tools-test.sh

    - name: Check that GitHub's source archives match the release archive
      run: sh tests/archive-policy-test.sh

    - name: Build the release archive twice
      run: |
        set -euo pipefail
        sh tools/make-release.sh HEAD "$RUNNER_TEMP/dist-a" >/dev/null
        sh tools/make-release.sh HEAD "$RUNNER_TEMP/dist-b" >/dev/null
        cmp "$RUNNER_TEMP"/dist-a/SHA256SUMS "$RUNNER_TEMP"/dist-b/SHA256SUMS
        cat "$RUNNER_TEMP/dist-a/SHA256SUMS"

  # docs/install.md's commands, run on a real distribution. The install guide's
  # mount needs CAP_SYS_ADMIN, which a privileged container on a GitHub-hosted
  # runner (a throwaway virtual machine) has.
  docs-commands:
    name: Install guide on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'almalinux:9']

    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run the commands of docs/install.md
      env:
        IMAGE: ${{ matrix.image }}
      run: |
        set -euo pipefail
        docker run --rm --privileged -v "$PWD:/plugin:ro" "$IMAGE" sh /plugin/tests/docs-commands.sh 2>&1 | tee "$RUNNER_TEMP/docs-commands.log"

    - name: Upload the log
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docs-commands-${{ strategy.job-index }}-log
        path: ${{ runner.temp }}/docs-commands.log
        if-no-files-found: ignore

  # The end-to-end test image is built once, here, into the GitHub Actions
  # cache. Each e2e job below rebuilds it from that cache in seconds.
  e2e-image:
    name: End-to-end test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build the image into the cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: tests/docker
        cache-from: type=gha,scope=e2e-image
        cache-to: type=gha,scope=e2e-image,mode=max

  # Every host-side runner under tests/ against a real Cacti and a MariaDB
  # service container. The runners start their own containers, on the service
  # container's network, from the image built above.
  e2e:
    name: ${{ matrix.runner }} on Cacti ${{ matrix.cacti.name }}
    needs: e2e-image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        runner: [objects, permissions, alert, config, restore, release, failure, import]
        cacti:
          - { name: '1.2.31', ref: 'release/1.2.31' }
          - { name: '1.2.x', ref: '1.2.x' }

    services:
      mariadb:
        image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
        env:
          MARIADB_ROOT_PASSWORD: cactiroot
          MARIADB_USER: cactiuser
          MARIADB_PASSWORD: cactiuser
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    env:
      CACTI_CORE: ${{ github.workspace }}/cacti
      E2E_DB_HOST: mariadb
      E2E_MARIADB_IMAGE: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
      MARIADB_ROOT_PASSWORD: cactiroot
      MARIADB_USER: cactiuser
      MARIADB_PASSWORD: cactiuser

    steps:
    - name: Checkout plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: plugin

    - name: Checkout Cacti
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: Cacti/cacti
        ref: ${{ matrix.cacti.ref }}
        path: cacti

    # The alert runner copies Thold and Maint from PLUGIN_SOURCE. The runner's
    # helper uses includes/functions.php, which the Thold 1.8.2 release does not
    # have, so Thold is pinned at a commit of its develop branch (1.8.3) that
    # supports Cacti 1.2.31 and 1.2.x; Maint is its 1.3 release.
    - name: Checkout Thold
      if: matrix.runner == 'alert'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: Cacti/plugin_thold
        ref: dc76952ee52e8b4877b2d5b830caab1f7c43dde9 # develop, 1.8.3
        path: plugin-source/thold

    - name: Checkout Maint
      if: matrix.runner == 'alert'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: Cacti/plugin_maint
        ref: cd62de9cc323a4f5a8ac80a8d9dda3c7fa16c470 # v1.3
        path: plugin-source/maint

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Load the end-to-end test image from the cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: plugin/tests/docker
        load: true
        tags: spm2-e2e
        cache-from: type=gha,scope=e2e-image

    - name: Run tests/run-${{ matrix.runner }}-e2e.sh
      env:
        RUNNER_NAME: ${{ matrix.runner }}
        PLUGIN_SOURCE: ${{ github.workspace }}/plugin-source
        E2E_NETWORK: ${{ job.services.mariadb.network }}
      run: |
        set -euo pipefail
        E2E_WORK="$RUNNER_TEMP/e2e"
        mkdir -p "$E2E_WORK"
        sh "plugin/tests/run-$RUNNER_NAME-e2e.sh" "$E2E_WORK" 2>&1 | tee "$E2E_WORK/runner.log"

    - name: Upload the logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-${{ matrix.runner }}-${{ matrix.cacti.name }}-logs
        path: |
          ${{ runner.temp }}/e2e/runner.log
          ${{ runner.temp }}/e2e/log-*.txt
          ${{ github.workspace }}/cacti/log/cacti.log
        if-no-files-found: ignore

  # The single check branch protection names: it fails unless every job above
  # succeeded. A skipped or cancelled job is a failure, so a job removed from
  # this list by mistake is the only way to lose coverage.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs:
      - workflow-lint
      - release-tools
      - entry-point-lint
      - integration-test
      - config-parser
      - docs-commands
      - e2e-image
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require every job to have succeeded
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
