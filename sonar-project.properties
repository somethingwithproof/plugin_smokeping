# CI-based SonarCloud analysis, run by .github/workflows/sonar.yml.
sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_plugin_smokeping
sonar.projectName=SmokePing Cacti Plugin
sonar.sourceEncoding=UTF-8

# Production code; the tests are analysed as tests.
sonar.sources=lib,cli,include,index.php,poller_smokeping.php,setup.php,smokeping.php,smokeping_config.php,smokeping_health.php,smokeping_import.php,smokeping_inventory.php
sonar.tests=tests
sonar.exclusions=vendor/**,locales/**

# Written by the unit suite in .github/workflows/sonar.yml.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
