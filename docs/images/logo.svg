<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 720 720" role="img" aria-labelledby="t">
  <title id="t">SmokePing Cacti Plugin: a cactus wearing a SmokePing graph badge</title>
  <!-- outline layer, then fill layer, so the arms and trunk read as one shape -->
  <g fill="#0f4d14" stroke="#0f4d14" stroke-width="22" stroke-linejoin="round">
    <path d="M285 500 V140 A75 75 0 0 1 435 140 V500 Z"/>
    <rect x="160" y="190" width="86" height="200" rx="43"/>
    <rect x="160" y="304" width="180" height="86" rx="43"/>
    <rect x="474" y="120" width="86" height="210" rx="43"/>
    <rect x="380" y="244" width="180" height="86" rx="43"/>
  </g>
  <g fill="#3cc41a">
    <path d="M285 500 V140 A75 75 0 0 1 435 140 V500 Z"/>
    <rect x="160" y="190" width="86" height="200" rx="43"/>
    <rect x="160" y="304" width="180" height="86" rx="43"/>
    <rect x="474" y="120" width="86" height="210" rx="43"/>
    <rect x="380" y="244" width="180" height="86" rx="43"/>
  </g>
  <!-- ribs -->
  <g stroke="#1f8f14" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="322" y1="110" x2="322" y2="485"/>
    <line x1="360" y1="78" x2="360" y2="485"/>
    <line x1="398" y1="110" x2="398" y2="485"/>
    <line x1="203" y1="215" x2="203" y2="345"/>
    <line x1="517" y1="145" x2="517" y2="285"/>
    <path d="M195 347 H300"/>
    <path d="M420 287 H525"/>
  </g>
  <!-- badge: a SmokePing graph, smoke around a median that turns amber on loss -->
  <g>
    <circle cx="452" cy="392" r="58" fill="#ffffff" stroke="#1f2328" stroke-width="12"/>
    <path d="M412 410 C424 404 430 388 442 392 S458 412 468 402 S484 376 494 380 L494 366 C484 360 476 384 468 388 S452 374 442 376 S424 390 412 394 Z" fill="#a7a7a7"/>
    <path d="M412 402 C424 397 432 386 442 384" fill="none" stroke="#2fb10f" stroke-width="7" stroke-linecap="round"/>
    <path d="M442 384 C452 386 458 400 468 396" fill="none" stroke="#ff6a00" stroke-width="7" stroke-linecap="round"/>
    <path d="M468 396 C478 390 484 374 494 372" fill="none" stroke="#2fb10f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="360" y="612" text-anchor="middle" font-family="Poppins, 'Montserrat', 'DejaVu Sans', sans-serif" font-weight="900" font-size="104" letter-spacing="1"><tspan fill="#1f9d0f">SMOKE</tspan><tspan fill="#1f2328">PING</tspan></text>
  <text x="360" y="672" text-anchor="middle" font-family="Poppins, 'Montserrat', 'DejaVu Sans', sans-serif" font-weight="600" font-size="38" letter-spacing="10" fill="#1f2328">CACTI PLUGIN</text>
</svg>
